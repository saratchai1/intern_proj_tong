name: Inspect report state

on:
  push:
    paths:
      - ".tmp/inspect_report/READY"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet python-docx
      - name: Inspect front matter only
        shell: bash
        run: |
          python - <<'PY'
          from docx import Document
          d=Document("รายงานสหกิจ.docx")
          for ti,t in enumerate(d.tables[:8]):
              txt=" | ".join(c.text.replace("\n"," / ") for row in t.rows for c in row.cells)
              print(f"T{ti}: {txt}")
          PY
