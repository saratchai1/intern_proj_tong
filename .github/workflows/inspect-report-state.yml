name: Inspect report state

on:
  push:
    paths:
      - ".tmp/inspect_report/READY"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet python-docx
      - name: Inspect selected report content
        shell: bash
        run: |
          python - <<'PY'
          from docx import Document
          d=Document("รายงานสหกิจ.docx")
          print("=== FRONT MATTER PARAGRAPHS ===")
          for i,p in enumerate(d.paragraphs[:80]):
              t=p.text.strip()
              if t:
                  print(f"P{i}: {t}")
          print("=== TABLES NEAR ABSTRACT ===")
          for ti,t in enumerate(d.tables[:15]):
              txt=" | ".join(c.text.replace("\n"," / ") for row in t.rows for c in row.cells)
              print(f"T{ti}: {txt[:2500]}")
          print("=== KEY METRICS ===")
          needles=["T01","T02–T05","44.8%","45.7%","14 Layout","15 Layout","27:06.10","29:11.52","3.9.1","Evaluation Workflow V1.0","Autodesk. (2013b","AutoLISP developer"]
          for i,p in enumerate(d.paragraphs):
              t=p.text.strip()
              if any(n in t for n in needles):
                  print(f"P{i}: {t}")
          for ti,t in enumerate(d.tables):
              txt=" | ".join(c.text.replace("\n"," / ") for row in t.rows for c in row.cells)
              if any(n in txt for n in needles):
                  print(f"T{ti}: {txt[:4000]}")
          PY
