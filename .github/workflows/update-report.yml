name: Apply cooperative report update

on:
  push:
    paths:
      - ".github/workflows/update-report.yml"

permissions:
  contents: write

jobs:
  update-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install document dependency
        run: python -m pip install --disable-pip-version-check python-docx

      - name: Backup current report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup
          cp "รายงานสหกิจ.docx" "backup/รายงานสหกิจ_before_update_2026-09-23.docx"

      - name: Update report in place
        run: python .report-update/update_report.py

      - name: Commit updated report and backup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "รายงานสหกิจ.docx" "backup/รายงานสหกิจ_before_update_2026-09-23.docx"
          if git diff --cached --quiet; then
            echo "No document changes to commit"
            exit 0
          fi
          git commit -m "Update cooperative report chapters 2 and 5; backup previous DOCX"
          git push
