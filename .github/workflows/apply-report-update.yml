name: Apply report update

on:
  push:
    paths:
      - ".tmp/report_update/READY"

permissions:
  contents: write

jobs:
  update-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install DOCX tooling
        run: python -m pip install --quiet python-docx
      - name: Backup and update report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup
          cp "รายงานสหกิจ.docx" "backup/รายงานสหกิจ_before_ch2_ch5_2026-09-23.docx"
          python ".tmp/report_update/update_report.py"
      - name: Commit report update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "รายงานสหกิจ.docx" "backup/รายงานสหกิจ_before_ch2_ch5_2026-09-23.docx"
          git commit -m "Update cooperative report chapters 2 and 5; add backup"
          git push
