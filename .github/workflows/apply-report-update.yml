name: Apply report update

on:
  push:
    paths:
      - ".tmp/report_b64/READY"

permissions:
  contents: write

jobs:
  update-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct updated DOCX and backup current report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backup
          cp "รายงานสหกิจ.docx" "backup/รายงานสหกิจ_before_ch2_ch5_2026-09-23.docx"
          cat .tmp/report_b64/part*.txt | base64 -d > "รายงานสหกิจ.docx"
          echo "4a01203626f69de1c2f3a9238a21a96f37d784027abd741ad5a0e34fce7eb70f  รายงานสหกิจ.docx" | sha256sum -c -
      - name: Commit report update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "รายงานสหกิจ.docx" "backup/รายงานสหกิจ_before_ch2_ch5_2026-09-23.docx"
          git commit -m "Update cooperative report chapters 2 and 5; add backup"
          git push
